services:
  prvenstvo-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prvenstvo
    ports:
      - "5432:5432"
    volumes:
      - prvenstvo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  izvestavanje-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: izvestavanje
    ports:
      - "5433:5432"
    volumes:
      - izvestavanje_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@prvenstvo-postgres:5432/prvenstvo
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      prvenstvo-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-a2:
    build: ./backend-a2
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@izvestavanje-postgres:5432/izvestavanje
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      izvestavanje-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  frontend-a2:
    build: ./frontend-a2
    ports:
      - "5174:80"
    depends_on:
      - backend-a2

volumes:
  prvenstvo_pgdata:
  izvestavanje_pgdata: